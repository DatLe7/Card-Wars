map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Re-resolve the API service when Compose replaces its container.
resolver 127.0.0.11 valid=10s ipv6=off;

# HTTP to HTTPS
server {
    listen 80;
    server_name cwtcg.online www.cwtcg.online;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name cwtcg.online www.cwtcg.online;

    ssl_certificate /etc/letsencrypt/live/cwtcg.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cwtcg.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    set $api http://api:3012;

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
